[project]
name = "brightbean-studio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "django-environ>=0.11,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "gunicorn>=22.0,<23.0",
    "django-allauth[socialaccount]>=65.0,<66.0",
    "bcrypt>=4.2,<5.0",
    "django-background-tasks>=1.2,<2.0",
    "django-tailwind[reload]>=3.8,<4.0",
    "django-htmx>=1.19,<2.0",
    "django-storages[s3]>=1.14,<2.0",
    "Pillow>=10.4,<11.0",
    "django-csp>=3.8,<4.0",
    "django-ratelimit>=4.1,<5.0",
    "cryptography>=43.0,<44.0",
    "whitenoise>=6.7,<7.0",
    "httpx>=0.27,<1.0",
    "python-dateutil>=2.9,<3.0",
    "django-ninja>=1.3,<2.0",
    "mcp>=1.0,<2.0",
    "django-oauth-toolkit>=3.0,<4.0",
    "sentry-sdk[django]>=2.13,<3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Django generates migrations with its own import ordering/formatting; don't
# lint or format generated schema migrations.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.lint.per-file-ignores]
# Intelligence client exceptions deliberately mirror Stripe / HTTP
# status names ("BadRequest", "NotFound", "Conflict", "RateLimited",
# "ServiceUnavailable", etc.) so the call sites read naturally:
#     except RateLimited as exc: ...
# An "Error" suffix would just be noise on names that already encode
# the failure mode. The flow-control sentinel ``_DeferredToWorker`` in
# views.py is also intentionally suffixless — it's not an error, it's
# a "this branch deferred to the worker" signal.
"apps/intelligence/services/exceptions.py" = ["N818"]
"apps/intelligence/views.py" = ["N818"]
# Ninja's ``File(...)`` / ``Form(...)`` / ``Query(...)`` are intentionally
# called in argument defaults — that's how Ninja registers field
# metadata for OpenAPI generation and request parsing. The B008 check
# doesn't apply.
"apps/api/routers/media.py" = ["B008"]
"apps/api/routers/analytics.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
